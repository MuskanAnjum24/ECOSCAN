<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Logout — EcoScan</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet"/>
  <script>sessionStorage.removeItem("ecoscan_auth"); sessionStorage.removeItem("ecoscan_user");</script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
    body{background:linear-gradient(135deg,#e8f5e9,#f0fdf4);min-height:100vh;display:flex;align-items:center;justify-content:center;}
    .card{background:#fff;border-radius:20px;padding:60px 52px;text-align:center;box-shadow:0 12px 48px rgba(0,0,0,0.1);max-width:460px;width:90%;}
    .icon{font-size:68px;color:#4CAF50;margin-bottom:20px;}
    h1{font-size:30px;color:#1a3d1a;margin-bottom:12px;font-weight:800;}
    p{color:#666;font-size:15px;margin-bottom:36px;line-height:1.7;}
    .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
    .btn{display:inline-block;padding:13px 32px;border-radius:8px;font-weight:700;font-size:14px;text-decoration:none;transition:all .2s;}
    .btn-green{background:#4CAF50;color:#fff;}
    .btn-green:hover{background:#388e3c;transform:translateY(-2px);}
    .btn-outline{background:transparent;color:#4CAF50;border:2px solid #4CAF50;}
    .btn-outline:hover{background:#4CAF50;color:#fff;transform:translateY(-2px);}
  </style>
</head>
<body>
  <div class="card">
    <div class="icon"><i class="fas fa-check-circle"></i></div>
    <h1>Logged Out Successfully</h1>
    <p>You have been securely logged out of your EcoScan account. Thank you for helping make India greener! 🌿</p>
    <div class="btns">
      <a href="login.html" class="btn btn-green">Login Again</a>
      <a href="index.html" class="btn btn-outline">Go to Home</a>
    </div>
  </div>
</body>
</html>
